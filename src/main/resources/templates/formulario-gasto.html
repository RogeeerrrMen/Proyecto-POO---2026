<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${gastoId == null}
            ? 'Registrar gasto' : 'Editar gasto'">
        Registrar gasto
    </title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/productos.css}">
    <link rel="stylesheet" th:href="@{/css/gastos.css}">
</head>
<body>
    <header class="navbar">
        <a class="logo" th:href="@{/dashboard}">
            Gestión de Pedidos
        </a>

        <nav class="nav-links" aria-label="Navegación principal">
            <a class="btn btn-secondary" th:href="@{/gastos}">
                Volver a gastos
            </a>
        </nav>
    </header>

    <main class="main-container">
        <section class="card card-register"
                 aria-labelledby="gasto-title">

            <p class="eyebrow">LAS FINANZAS DE TU NEGOCIO</p>

            <h1 class="card-title" id="gasto-title"
                th:text="${gastoId == null}
                        ? 'Registra un gasto.' : 'Edita tu gasto.'">
            </h1>

            <p class="card-subtitle">
                Describe el gasto e indica su monto y la fecha en que ocurrió.
            </p>

            <p class="alert alert-error" role="alert"
               th:if="${error}" th:text="${error}"></p>

            <form th:action="${gastoId == null}
                          ? @{/gastos}
                          : @{/gastos/{id}(id=${gastoId})}"
                  th:object="${gasto}"
                  method="post">

                <div class="form-group">
                    <label for="descripcion">Descripción</label>
                    <textarea id="descripcion"
                              th:field="*{descripcion}"
                              th:errorclass="campo-invalido"
                              maxlength="500"
                              rows="4"
                              placeholder="Ejemplo: compra de materiales"
                              required></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="monto">Monto (Q)</label>
                        <input type="number"
                               id="monto"
                               th:field="*{monto}"
                               th:errorclass="campo-invalido"
                               min="0.01"
                               max="999999999999.99"
                               step="0.01"
                               placeholder="0.00"
                               aria-describedby="monto-ayuda"
                               required>

                        <small class="gasto-ayuda" id="monto-ayuda">
                            Debe ser mayor que cero, con hasta dos decimales.
                        </small>
                    </div>

                    <div class="form-group">
                        <label for="fecha">Fecha del gasto</label>
                        <input type="date"
                               id="fecha"
                               th:field="*{fecha}"
                               th:errorclass="campo-invalido"
                               aria-describedby="fecha-ayuda"
                               required>

                        <small class="gasto-ayuda" id="fecha-ayuda">
                            Selecciona la fecha en que ocurrió el gasto.
                            No se permiten fechas futuras.
                        </small>
                    </div>
                </div>

                <button class="btn btn-primary" type="submit"
                        th:text="${gastoId == null}
                                ? 'Guardar gasto' : 'Guardar cambios'">
                    Guardar gasto
                </button>
            </form>

            <p class="form-footer">
                <a th:href="@{/gastos}">
                    Cancelar y volver al listado
                </a>
            </p>
        </section>
    </main>
</body>
</html>
