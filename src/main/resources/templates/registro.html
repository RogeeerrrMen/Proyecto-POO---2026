<!DOCTYPE html>
<html lang="es">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <meta charset="UTF-8">
    <title>Crear cuenta</title>
</head>

<body>
    <header class="navbar">
        <a class="logo" th:href="@{/}">Gestión de Pedidos</a>

        <nav class="nav-links" aria-label="Navegación principal">
            <a class="btn btn-secondary" th:href="@{/}">
                Volver al inicio
            </a>
        </nav>
    </header>

    <main class="main-container">
        <section class="card card-register" aria-labelledby="registro-title">
            <h1 class="card-title" id="registro-title">
                Un nuevo comienzo.
            </h1>

            <p class="card-subtitle">
                Completa tus datos y los de tu emprendimiento.
            </p>

            <form th:action="@{/registro}" method="post">
                <div class="form-row">
                    <div class="form-group">
                        <label for="nombre">Nombre</label>
                        <input
                            type="text"
                            id="nombre"
                            name="nombre"
                            placeholder="Tu nombre"
                            autocomplete="given-name"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="apellido">Apellido</label>
                        <input
                            type="text"
                            id="apellido"
                            name="apellido"
                            placeholder="Tu apellido"
                            autocomplete="family-name"
                            required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="correo">Correo electrónico</label>
                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="nombre@ejemplo.com"
                        autocomplete="email"
                        required>
                </div>

                <div class="form-group">
                    <label for="emprendimiento">
                        Nombre del emprendimiento
                    </label>
                    <input
                        type="text"
                        id="emprendimiento"
                        name="emprendimiento"
                        placeholder="¿Cómo se llama tu negocio?"
                        autocomplete="organization"
                        required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Crea una contraseña"
                            autocomplete="new-password"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="confirmacion">Confirmar contraseña</label>
                        <input
                            type="password"
                            id="confirmacion"
                            name="confirmacion"
                            placeholder="Repítela aquí"
                            autocomplete="new-password"
                            required>
                    </div>
                </div>

                <button class="btn btn-primary" type="submit">
                    Crear cuenta
                </button>
            </form>

            <p class="form-footer">
                ¿Ya tienes una cuenta?
                <a th:href="@{/login}">Iniciar sesión</a>
            </p>
        </section>
    </main>
</body>

</html>
