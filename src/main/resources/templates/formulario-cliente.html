<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${titulo}">Formulario de cliente</title>

    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/interfaz.css(v=3)}">
</head>

<body class="app-page">
    <header th:replace="~{fragments/navegacion :: barra('clientes')}"></header>

    <main class="main-container" id="contenido" tabindex="-1">
        <section class="card" aria-labelledby="formulario-title">
            <p class="eyebrow">TU EMPRENDIMIENTO</p>

            <h1 class="card-title"
                id="formulario-title"
                th:text="${titulo}">
                Formulario de cliente
            </h1>

            <p class="card-subtitle">
                Completa los datos de contacto y facturación de tu cliente.
            </p>

            <p class="cliente-error"
               th:if="${error}"
               th:text="${error}"
               role="alert"></p>

            <form th:action="@{${accion}}"
                  th:object="${cliente}"
                  method="post">

                <h2>Datos de contacto</h2>

                <div class="form-group">
                    <label for="nombre">Nombre</label>

                    <input type="text"
                           id="nombre"
                           th:field="*{nombre}"
                           placeholder="Nombre del cliente"
                           autocomplete="name"
                           maxlength="255"
                           required>
                </div>

                <div class="form-group">
                    <label for="telefono">Teléfono</label>

                    <input type="tel"
                           id="telefono"
                           th:field="*{telefono}"
                           placeholder="Número de contacto"
                           autocomplete="tel"
                           pattern="\+?[0-9]+"
                           title="Ingresa números con un + opcional al inicio."
                           aria-describedby="telefono-ayuda"
                           maxlength="255"
                           required>

                    <small id="telefono-ayuda" class="cliente-ayuda">
                        Si el teléfono es de otro país, incluye + y el
                        código de país al inicio.
                    </small>
                </div>

                <h2>Datos de facturación</h2>

                <p class="cliente-ayuda">
                    Estos datos son opcionales.
                </p>

                <div class="form-group">
                    <label for="nit">NIT (opcional)</label>

                    <input type="text"
                           id="nit"
                           th:field="*{nit}"
                           placeholder="NIT del cliente"
                           maxlength="255">
                </div>

                <div class="form-group">
                    <label for="razonSocial">Razón social (opcional)</label>

                    <input type="text"
                           id="razonSocial"
                           th:field="*{razonSocial}"
                           placeholder="Nombre para la facturación"
                           maxlength="255">
                </div>

                <button class="btn btn-primary" type="submit">
                    Guardar cliente
                </button>

                <a class="btn btn-secondary" th:href="@{/clientes}">
                    Cancelar
                </a>
            </form>
        </section>
    </main>
</body>

</html>
