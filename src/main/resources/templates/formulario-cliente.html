<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Formulario de cliente</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>
    <header class="navbar">
        <a class="logo" th:href="@{/dashboard}">
            Gestión de Pedidos
        </a>

        <nav class="nav-links" aria-label="Navegación principal">
            <a class="btn btn-secondary" th:href="@{/clientes}">
                Volver a clientes
            </a>
        </nav>
    </header>

    <main class="main-container">
        <section class="card" aria-labelledby="formulario-title">
            <p class="eyebrow">TU EMPRENDIMIENTO</p>

            <h1 class="card-title"
                id="formulario-title"
                th:text="${titulo}">
                Formulario de cliente
            </h1>

            <p class="card-subtitle">
                Completa los datos de contacto de tu cliente.
            </p>

            <p class="cliente-error"
               th:if="${error}"
               th:text="${error}"
               role="alert"></p>

            <form th:action="@{${accion}}"
                  th:object="${cliente}"
                  method="post">

                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input
                        type="text"
                        id="nombre"
                        th:field="*{nombre}"
                        placeholder="Nombre del cliente"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="telefono">Teléfono</label>
                    <input
                        type="tel"
                        id="telefono"
                        th:field="*{telefono}"
                        placeholder="Número de contacto."
                        autocomplete="tel"
                        pattern="\+?[0-9]+"
                        title="Ingresa solo números."
                        aria-describedby="telefono-ayuda"
                        required
                    >

                    <small id="telefono-ayuda" class="cliente-ayuda">
                        Si el teléfono es de otro país, incluye + y el código de país al inicio.
                    </small>

                </div>

                <button class="btn btn-primary" type="submit">
                    Guardar cliente
                </button>

                <a class="btn btn-secondary" th:href="@{/clientes}">
                    Cancelar
                </a>
            </form>
        </section>
    </main>
</body>

</html>
