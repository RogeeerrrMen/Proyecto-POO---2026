<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Agregar producto</title>
</head>
<body>
    <h1>Agregar producto</h1>

    <form th:action="@{/productos}" th:object="${producto}" method="post">
        <div>
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" th:field="*{nombre}" required>
        </div>
        <div>
            <label for="descripcion">Descripción</label>
            <textarea id="descripcion" th:field="*{descripcion}"></textarea>
        </div>
        <div>
            <label for="precio">Precio</label>
            <input type="number" step="0.01" min="0" id="precio" th:field="*{precio}" required>
        </div>
        <button type="submit">Guardar producto</button>
    </form>

    <p><a th:href="@{/productos}">Cancelar</a></p>
</body>
</html>
