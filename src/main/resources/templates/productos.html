<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Productos</title>
</head>
<body>
    <h1>Productos</h1>

    <a th:href="@{/productos/nuevo}">Agregar producto</a>

    <table border="1" cellpadding="6">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Precio</th>
                <th>Activo</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="producto : ${productos}">
                <td th:text="${producto.id}"></td>
                <td th:text="${producto.nombre}"></td>
                <td th:text="${producto.descripcion}"></td>
                <td th:text="${producto.precio}"></td>
                <td th:text="${producto.activo} ? 'Sí' : 'No'"></td>
            </tr>
        </tbody>
    </table>

    <p th:if="${#lists.isEmpty(productos)}">Todavía no hay productos registrados.</p>

    <p><a th:href="@{/dashboard}">Volver a la pantalla de inicio</a></p>
</body>
</html>
