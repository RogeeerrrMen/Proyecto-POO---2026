# Nombre de la aplicación
spring.application.name=gestionpedidos

# Configuración de PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/ProyectoPOO2026
spring.datasource.username=postgres
spring.datasource.password=Aca ponen su contrasena que definieron cuando instalen SQL y pgAdmin 
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false